# One-click deploy blueprint for Render (https://render.com). Add secrets in the dashboard.
services:
  - type: web
    name: admitiq
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: TRUST_PROXY
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: AI_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_API_KEY
        sync: false
      - key: SCORECARD_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
