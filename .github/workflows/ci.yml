name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: node --check server/server.mjs && node --check scripts/setup.mjs
  typecheck:
    runs-on: ubuntu-latest
    # The React components were bundled and browser-tested but never type-checked (no @types/react offline
    # when they were written). Remove continue-on-error once this job is green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
