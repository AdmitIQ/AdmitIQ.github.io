<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="AdmitIQ — compare colleges, assess fit, plan costs, improve essays and track applications. Your college strategy, backed by data." />
  <meta name="theme-color" content="#f2eee4" />
  <title>AdmitIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
  <script>
    // Apply theme before first paint to avoid a flash.
    try { var t = (JSON.parse(localStorage.getItem('admitiq:v1') || '{}').prefs || {}).theme; var r = document.documentElement; if (r.getAttribute('data-viewer-theme') === null) r.setAttribute('data-viewer-theme', r.getAttribute('data-theme') || ''); var v = r.getAttribute('data-viewer-theme'); r.setAttribute('data-theme', t === 'dark' || t === 'light' ? t : (v === 'dark' || v === 'light') ? v : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); } catch (e) {}
  </script>
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>
  <div id="root">
    <div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#67676d">Loading AdmitIQ…</div>
  </div>
  <noscript>AdmitIQ needs JavaScript to run.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
